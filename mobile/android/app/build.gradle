apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    //
    //   Only the development variant (dev, application id com.hawa.dev) is listed: it embeds NO JS bundle and always loads
    //   its JavaScript from Metro (Fast Refresh), so it needs Metro running and `adb reverse tcp:8081 tcp:8081`.
    //   Every other variant is deliberately NOT listed and keeps bundling its JS exactly as before: the isolated audit
    //   build (debug, application id com.hawa.audit) must carry its own JS bundle, because reminder delivery,
    //   notification taps and the time-zone/clock reschedule receiver start a headless JS task while no Metro server is
    //   attached (phone unplugged, app process dead); a Metro-only APK could not run them. Metro still takes over in
    //   the audit build when it is reachable. The pilot and release builds always bundle.
    debuggableVariants = ["dev"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hawa"
    defaultConfig {
        applicationId "com.hawa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            // Isolated audit variant: installs BESIDE the production app (com.hawa), never over it. A different
            // package id means its own data directory, Android Keystore keys, Keychain entries, notification
            // channels and alarms. `namespace` stays "com.hawa", so the Kotlin classes and manifest component names
            // (.MainActivity, .LauncherAwa, ...) and the JS-side 'com.hawa.MainActivity' launch class are unchanged.
            // The release build type keeps applicationId "com.hawa".
            applicationIdSuffix ".audit"
            versionNameSuffix "-audit"
            signingConfig signingConfigs.debug
        }
        // Development variant (daily UI work with Metro and Fast Refresh): installs BESIDE com.hawa, com.hawa.audit and
        // com.hawa.pilot with its own EMPTY sandbox: application id, data directory, Android Keystore keys, Keychain
        // entries, notification channels, alarms and content provider authorities all derive from "com.hawa.dev".
        // `namespace` stays "com.hawa", so the Kotlin classes and manifest component names do not move.
        //
        // It is listed in debuggableVariants (react block above), so it embeds NO JS bundle and loads its JavaScript from
        // Metro on port 8081 (the React Native default; run `adb reverse tcp:8081 tcp:8081`). It is debuggable, so
        // BuildConfig.DEBUG switches React Native dev support on, and matchingFallbacks makes the autolinked libraries
        // resolve their debug variants (dev support, Hermes inspector). Cleartext HTTP to Metro is enabled only here and
        // in the audit variant, through the manifest overlays in src/dev and src/debug. Never distribute this build:
        // debuggable, cleartext and debug-signed.
        //
        // Configured explicitly (no initWith) and placed ahead of the release block, which must stay the LAST build type
        // (src/services/__tests__/androidAuditVariant.test.ts reads everything after it as "release").
        dev {
            matchingFallbacks = ['debug']
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            debuggable true
            signingConfig signingConfigs.debug
        }
        // Isolated pilot variant (Design System device review): installs BESIDE com.hawa and com.hawa.audit with its own
        // EMPTY sandbox, so the first-run screens (Welcome, Name) can be reviewed on a phone without touching any
        // existing app's data. Same mechanism as the audit variant above: a different application id means its own data
        // directory, Android Keystore keys, Keychain entries, notification channels, alarms, permissions and content
        // provider authorities (every authority in the merged manifest is "<applicationId>.<name>"). `namespace` stays
        // "com.hawa", so the Kotlin classes and manifest component names do not move.
        //
        // Release-like on purpose: not debuggable, no cleartext overlay and no dev menu, with the JS bundled (see
        // debuggableVariants). It is configured explicitly rather than with initWith so that the release block below stays
        // the LAST build type (src/services/__tests__/androidAuditVariant.test.ts reads everything after it as "release"),
        // and it mirrors that block's signing, minify and proguard settings. matchingFallbacks lets the autolinked React
        // Native libraries, which only publish debug and release, resolve this variant.
        pilot {
            matchingFallbacks = ['release']
            applicationIdSuffix ".pilot"
            versionNameSuffix "-pilot"
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// react-native-documents/picker ships a TurboModule spec. Its native codegen output (a CMake directory the app's native
// build includes through autolinking) is produced by the library's own Gradle task, and nothing in the app's task graph
// guaranteed it ran BEFORE CMake configured the app — a first build on a fresh checkout failed with "add_subdirectory given
// source ... codegen/jni/ which is not an existing directory". Make the ordering explicit.
tasks.matching { it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') }.configureEach {
    dependsOn(':react-native-documents_picker:generateCodegenArtifactsFromSchema')
}
