buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Sentry: uploads the native debug symbols and the ProGuard/R8 mapping of release builds (applied in app/build.gradle only
        // when SENTRY_AUTH_TOKEN is set, so builds never depend on it).
        classpath("io.sentry:sentry-android-gradle-plugin:6.27.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
